[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alisa-faction-knowledge-ingestion"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
qdrant = ["qdrant-client>=1.9", "requests>=2.31"]

[project.scripts]
knowledge-ingest = "knowledge_ingestion_service.cli:main"
knowledge-search = "knowledge_ingestion_service.search_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
