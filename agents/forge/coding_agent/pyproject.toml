[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alisa-coding-agent"
version = "0.1.0"
description = "Controlled software implementation and verification agent for ALISA"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter-language-pack>=1.20,<2",
    "pydantic>=2.7,<3",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]